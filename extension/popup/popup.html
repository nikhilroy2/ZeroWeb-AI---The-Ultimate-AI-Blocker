<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroWeb AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-box">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="../assets/icons/icon32.png" alt="ZeroWeb AI" class="logo">
        <span class="brand-name">ZeroWeb AI</span>
      </div>
      <label class="switch" title="Toggle Master AI Shield">
        <input type="checkbox" id="masterToggle" checked>
        <span class="slider round"></span>
      </label>
    </header>

    <!-- Main Domain Control Card -->
    <main class="site-card">
      <div class="site-header">
        <span class="globe-icon">🌐</span>
        <span class="domain-text" id="siteDomain">Current Page</span>
      </div>
      <div class="status-pill" id="siteStatusBadge">BLOCKING ALL AI</div>

      <button class="action-btn" id="whitelistToggleBtn">
        Allow AI on this site
      </button>
    </main>

    <!-- Simple Stats -->
    <footer class="stats-row">
      <div class="stat-col">
        <span class="stat-num" id="pageBlockedCount">0</span>
        <span class="stat-lbl">Blocked on page</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-col">
        <span class="stat-num" id="totalBlockedCount">0</span>
        <span class="stat-lbl">Total blocked</span>
      </div>
    </footer>

    <!-- Settings Footer Link -->
    <div class="settings-link-row">
      <button class="settings-link" id="openSettingsBtn">⚙️ Manage Allowed Sites & Settings</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
