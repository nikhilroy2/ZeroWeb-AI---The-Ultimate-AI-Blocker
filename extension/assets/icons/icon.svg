<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Shield -->
  <circle cx="64" cy="64" r="56" fill="url(#shieldGrad)" stroke="url(#roseGrad)" stroke-width="4" />

  <!-- Inner Zero Ring -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="url(#roseGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Slash across Zero -->
  <line x1="38" y1="38" x2="90" y2="90" stroke="url(#roseGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- AI Sparkle Accents (Blocked AI nodes) -->
  <g fill="url(#cyanGrad)">
    <circle cx="92" cy="36" r="4.5" />
    <path d="M 92 27 L 93.5 33 L 99.5 34.5 L 93.5 36 L 92 42 L 90.5 36 L 84.5 34.5 L 90.5 33 Z" />
    <circle cx="36" cy="92" r="4.5" />
    <path d="M 36 83 L 37.5 89 L 43.5 90.5 L 37.5 92 L 36 98 L 34.5 92 L 28.5 90.5 L 34.5 89 Z" />
  </g>
</svg>

