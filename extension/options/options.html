<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroWeb AI - Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="../assets/icons/icon48.png" alt="ZeroWeb AI" class="logo">
        <h1>ZeroWeb AI Settings</h1>
      </div>
      <div class="master-control">
        <span class="master-label" id="masterStatusLabel">Shield Active</span>
        <label class="switch">
          <input type="checkbox" id="masterToggle" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </header>

    <!-- Card 1: Whitelist / Allowed Sites -->
    <section class="card">
      <div class="card-header">
        <h2>Allowed Websites (Exceptions)</h2>
      </div>

      <div class="input-row">
        <input type="text" id="domainInput" placeholder="e.g. chatgpt.com, claude.ai, gemini.google.com" class="text-input">
        <button class="btn btn-emerald" id="addDomainBtn">Allow Website</button>
      </div>

      <div class="whitelist-box" id="whitelistContainer">
        <!-- Dynamically populated -->
        <div class="empty-state">No websites allowed.</div>
      </div>
    </section>

    <!-- Card 2: Interception Screen -->
    <section class="card">
      <div class="card-header">
        <h2>Block Page Behavior</h2>
      </div>

      <div class="toggle-row">
        <div class="toggle-info">
          <strong>Show "Access Blocked" Screen</strong>
        </div>
        <label class="switch">
          <input type="checkbox" id="showBlockedPageToggle" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </section>

    <!-- Card 3: Interception Statistics -->
    <section class="card">
      <div class="card-header">
        <h2>Interception Statistics</h2>
      </div>

      <div class="stats-box">
        <div class="stat-number-box">
          <span class="stat-big" id="totalBlockedNum">0</span>
          <span class="stat-text">Total Blocked</span>
        </div>
        <button class="btn btn-outline" id="resetStatsBtn">Reset Counter</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script src="options.js"></script>
</body>
</html>
