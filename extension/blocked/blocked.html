<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Access Blocked - ZeroWeb AI</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <div class="blocked-card">
    <div class="shield-icon-wrap">
      <img src="../assets/icons/icon128.png" alt="ZeroWeb AI Shield" class="shield-img">
    </div>

    <span class="badge">ZeroWeb AI Active</span>
    <h1 class="headline">AI Destination Blocked</h1>
    <p class="description">
      ZeroWeb AI blocks all standalone generative AI platforms by default to protect your cognitive focus and prevent distractions.
    </p>

    <!-- Target Domain Card -->
    <div class="target-card">
      <span class="target-label">Blocked Domain</span>
      <span class="target-url" id="blockedTargetUrl">Loading...</span>
    </div>

    <!-- Actions -->
    <div class="action-buttons">
      <button class="btn btn-primary" id="goBackBtn">
        ← Return to Safety
      </button>
      <button class="btn btn-secondary" id="allowSiteBtn">
        🛡️ Allow This Website (Whitelist)
      </button>
    </div>

    <div class="blocked-footer">
      <button class="link-btn" id="openSettingsBtn">⚙️ Manage Allowed Sites &amp; Settings</button>
      <span class="footer-note">ZeroWeb AI Manifest V3 &bull; All AI blocked by default</span>
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
